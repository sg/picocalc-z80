;XMODEM 2.x configuration for the picocalc-z80 comms disk.
;Must be on the default drive.
;
;Transfers go over the WiFi modem on IMSAI SIO-2 port B (ports
;24/25h). Dial and CONNECT with QT or Kermit first, start the
;sender or receiver at the far end, then exit to CP/M and run
;XMODEM; quitting QT with ^^Q keeps the call up.
;
;/Z6 is the longest timeout XMODEM offers; the emulated CPU runs
;at 4 MHz unless the setup menu says otherwise.

/MTransfer port is the WiFi modem
/X2
/P 25 24 01 02 01
/Z6
