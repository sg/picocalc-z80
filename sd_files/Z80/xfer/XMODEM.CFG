;XMODEM 2.x configuration for picocalc-z80. Must be on the default drive.
;
;Transfers go over the USB-C serial port as IMSAI SIO-2 port A (ports
;22/23h), which passes all 8 bits untouched and takes the line away from
;the console until XMODEM exits. Progress shows on the PicoCalc screen.
;
;/Z6 is the longest timeout XMODEM offers; the emulated CPU runs
;at 4 MHz unless the setup menu says otherwise.

/MTransfer port is the USB-C serial line
/X2
/P 23 22 01 02 01
/Z6
